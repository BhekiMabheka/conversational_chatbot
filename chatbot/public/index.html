<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Knowledge-base Chatbot</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #eef0f2;
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #333; }
      main { width: min(720px, 100% - 24px); padding: 24px 0; }
      #chat { height: min(720px, calc(100vh - 120px)); }
      p { text-align: center; font-size: 13px; color: #666; }
      code { background: #fff; padding: 2px 6px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <main>
      <div id="chat"></div>
      <p>Add this bot to any website: <code>&lt;script src="<span id="origin"></span>/widget.js" defer&gt;&lt;/script&gt;</code></p>
    </main>
    <script>document.getElementById('origin').textContent = location.origin;</script>
    <script src="/widget.js" data-mode="inline" data-target="#chat"></script>
  </body>
</html>
